<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header"><h5 class="mb-0">Modifier un avion</h5></div>
    <div class="card-body">
      <form (ngSubmit)="updateAvion()">
        <div class="mb-3">
          <label class="form-label">ID</label>
          <input type="number" class="form-control" name="idAvion" [(ngModel)]="currentAvion.idAvion" readonly />
        </div>
        <div class="mb-3">
          <label class="form-label">Modele</label>
          <input type="text" class="form-control" name="modele" [(ngModel)]="currentAvion.modele" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Compagnie</label>
          <input type="text" class="form-control" name="compagnie" [(ngModel)]="currentAvion.compagnie" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Capacite</label>
          <input type="number" class="form-control" name="capacite" [(ngModel)]="currentAvion.capacite" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Date de mise en service</label>
          <input type="date" class="form-control" name="dateMiseEnService" [(ngModel)]="dateMiseEnServiceStr" required />
        </div>
        <button type="submit" class="btn btn-success">Enregistrer</button>
      </form>
    </div>
  </div>
</div>
